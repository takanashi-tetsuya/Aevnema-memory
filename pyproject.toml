[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "associative-memory-demo"
version = "0.1.0"
description = "Growing episodic/concept associative memory demo"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "requests>=2.32",
    "jsonschema>=4.23",
]

[project.scripts]
memory-demo = "memory_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_demo = ["schema.sql", "contracts/*.schema.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
testpaths = ["tests"]
norecursedirs = ["_archive", "validation", "logs", "database"]
